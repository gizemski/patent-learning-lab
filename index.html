<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Learning Lab: Concept Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202e; --ink2:#465263; --muted:#6a7484; --line:#e2e5ea; --bg:#f6f7f9; --card:#fff;
  --accent:#0f6b67; --accent-ink:#0b5450; --accent-soft:#e2f1f0;
  --hi:#b8571c; --hi-soft:#fbece2; --bad:#a83a2c; --bad-soft:#f9e4e0;
  --r:14px; --focus:0 0 0 3px #0f6b6755;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;font-size:16px}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;line-height:1.2;margin:0 0 .45em;font-weight:700}
h1{font-size:clamp(1.9rem,3.6vw,2.7rem)} h2{font-size:1.6rem} h3{font-size:1.15rem}
a{color:var(--accent-ink)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:#fff;padding:8px 12px;border-radius:8px;z-index:20}
.skip:focus{left:8px}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.hdr{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:"Source Serif 4",serif;font-weight:700;font-size:1.2rem}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ink);display:grid;place-items:center}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{text-decoration:none;color:var(--ink2);padding:7px 13px;border-radius:999px;font-weight:500;font-size:.95rem}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:6px 11px;font-size:.85rem;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
main{max-width:1120px;margin:0 auto;padding:32px 24px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:24px 26px}
.eyebrow{font-size:.75rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
.btn:hover{background:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--accent)}
.btn.quiet{background:#eceef2;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center;margin-bottom:28px}
.hero p{color:var(--ink2);font-size:1.07rem;max-width:56ch}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{display:block;text-decoration:none;color:var(--ink);padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile b{display:block;font-size:1rem;margin:6px 0 2px}
.tile span{font-size:.86rem;color:var(--muted)}
.ico{font-size:1.4rem}
/* timeline */
.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin:8px 0 4px;position:relative}
.step{position:relative;text-align:center;padding:0 4px;border:0;background:transparent}
.step::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--accent)}
.node{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-weight:700;font-size:.9rem;background:#fff;border:3px solid var(--line);color:var(--muted)}
.step.done .node{background:var(--accent);border-color:var(--accent);color:#fff}
.step.cur .node{border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.step .lbl{font-weight:600;font-size:.85rem;display:block}
.step .when{font-size:.76rem;color:var(--muted);display:block}
.lesson{margin-top:22px}
.lesson p{max-width:70ch}
.callout{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:8px;margin:16px 0;max-width:70ch}
.nav-row{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.progress{height:8px;background:#e9ecf0;border-radius:99px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
/* quiz */
.scenario{background:var(--hi-soft);border-radius:var(--r);padding:16px 18px;margin:12px 0 4px;display:flex;gap:14px;align-items:flex-start}
.q{margin:20px 0}
.q legend{font-weight:600;margin-bottom:8px;padding:0}
fieldset{border:0;margin:0;padding:0}
.opt{display:block;width:100%;text-align:left;padding:11px 14px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#fff}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{font-size:.9rem;margin-top:4px;color:var(--ink2)}
.result{padding:16px 18px;border-radius:var(--r);margin-top:16px}
.result.pass{background:var(--accent-soft)} .result.fail{background:var(--bad-soft)}
.cert{border:2px solid var(--ink);border-radius:var(--r);padding:36px 28px;text-align:center;background:linear-gradient(160deg,#fff 40%,var(--accent-soft));margin-top:18px}
.cert .name{font-family:"Source Serif 4",serif;font-size:1.7rem;border-bottom:1px solid var(--ink);display:inline-block;padding:0 24px 4px;margin:10px 0}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:min(340px,100%)}
/* tutor */
.chat{display:flex;flex-direction:column;gap:12px;min-height:300px;max-height:460px;overflow:auto;padding:18px;background:#fafbfc;border:1px solid var(--line);border-radius:var(--r)}
.msg{max-width:80%;padding:11px 14px;border-radius:14px;font-size:.95rem}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.cite{display:block;margin-top:8px;font-size:.8rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.86rem}
.chip:hover{border-color:var(--accent)}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1;width:auto}
.notice{font-size:.84rem;color:var(--ink2);background:#eef0f3;padding:10px 14px;border-radius:10px;margin-top:12px}
/* insights */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.kpi{padding:16px 18px}
.kpi b{display:block;font-family:"Source Serif 4",serif;font-size:1.9rem;line-height:1.1}
.kpi span{font-size:.85rem;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.chart-card{padding:18px 18px 14px}
.chart-card h3{font-size:1rem;font-family:Inter,sans-serif;font-weight:600;margin-bottom:2px}
.chart-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.linkbtn{border:0;background:none;color:var(--accent-ink);font-size:.8rem;font-weight:600;padding:2px 4px;white-space:nowrap}
.bars{margin-top:12px}
.bar-row{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:8px;padding:4px 0;cursor:default;border-radius:6px}
.bar-row:hover{background:#f2f4f6}
.bar-row .bl{font-size:.82rem;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bv{font-size:.82rem;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.track{height:14px;position:relative}
.fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.fill.hi{background:var(--hi)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:.8rem;padding:7px 10px;border-radius:8px;z-index:30;opacity:0;transition:opacity .12s;max-width:240px}
table.data{width:100%;border-collapse:collapse;margin-top:10px;font-size:.84rem}
table.data th,table.data td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.data td:last-child,table.data th:last-child{text-align:right}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.ins{padding:16px 18px;border-left:4px solid var(--hi)}
.ins .k{font-weight:600}
.ins .a{margin-top:6px;font-size:.92rem;color:var(--ink2)}
.ins .a b{color:var(--ink)}
.sample{display:inline-block;background:var(--hi-soft);color:#8a3d10;font-weight:600;font-size:.78rem;padding:3px 10px;border-radius:99px}
/* about */
table.map{width:100%;border-collapse:collapse}
table.map th,table.map td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.93rem}
table.map th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pipe{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:14px 0}
.pipe div{flex:1 1 140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;position:relative}
.pipe div b{display:block;font-size:.92rem;margin-bottom:2px}
.pipe div.human{border-color:var(--accent);background:var(--accent-soft)}
.paths{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.path{padding:16px;display:flex;flex-direction:column;gap:6px}
.path .btn{margin-top:auto;justify-content:center;font-size:.88rem;padding:9px 12px}
.path.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.path.soon b{color:var(--ink2)}
.path-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.ob{display:inline-grid;place-items:center;min-width:44px;height:26px;padding:0 8px;border-radius:7px;background:var(--ink);color:#fff;font-size:.72rem;font-weight:700;letter-spacing:.04em}
.path.soon .ob{background:#9aa3b0}
.badge{white-space:nowrap;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;background:#eceef2;color:var(--muted)}
.badge.ok{background:var(--accent-soft);color:var(--accent-ink)}
.pathpill{display:inline-flex;align-items:center;gap:10px;background:#f1f3f5;border-radius:999px;padding:4px 14px 4px 4px;font-size:.86rem}
.pathpill a{font-weight:600;font-size:.82rem}
@media (max-width:900px){.paths{grid-template-columns:repeat(2,1fr)}}
/* deadline calculator */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.disc{background:var(--hi-soft);border-left:4px solid var(--hi);padding:12px 16px;border-radius:8px;margin:14px 0;max-width:78ch;font-size:.93rem}
.calc-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px;margin-top:18px;align-items:start}
.calc-wrap h3{margin-bottom:10px}
.field{margin:0 0 16px}
.field label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:600;font-size:.95rem}
.field .hint{display:block;font-size:.84rem;color:var(--ink2);margin:2px 0 6px;max-width:52ch}
.calc-wrap input[type=date]{font:inherit;padding:9px 12px;border:1px solid #767f8c;border-radius:10px;width:100%;max-width:240px;min-height:44px;background:#fff;color:var(--ink)}
.calc-wrap input[aria-invalid="true"]{border-color:var(--bad);border-width:2px}
.badge.dep{background:var(--hi-soft);color:#8a3d10}
.badge.in{color:var(--ink2)}
.badge.wait{background:#fff;border:1px dashed #767f8c;color:var(--ink2)}
.calc-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.legend{display:flex;flex-direction:column;gap:6px;margin:0 0 14px;padding:0;list-style:none;font-size:.85rem;color:var(--ink2)}
.legend li{display:flex;gap:8px;align-items:center}
.ctl{list-style:none;margin:8px 0 0;padding:0}
.ctl li{position:relative;padding:0 0 18px 46px;min-height:52px}
.ctl li::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.ctl li:last-child::before{display:none}
.ctl li.wait::before,.ctl li.dep.none::before{background:repeating-linear-gradient(var(--line) 0 4px,transparent 4px 8px)}
.dot{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;font-weight:700}
.dot.in{background:#eceef2;border:2px solid var(--ink2);color:var(--ink)}
.dot.calc{background:var(--accent);color:#fff}
.dot.dep{background:var(--hi-soft);border:2px solid var(--hi);color:#8a3d10}
.dot.wait,.dot.none{background:#fff;border:2px dashed #767f8c;color:var(--ink2)}
.ev-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-name{font-weight:600}
.ev-date{font-family:"Source Serif 4",Georgia,serif;font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums}
.ev-date.none{font-family:Inter,sans-serif;font-size:.95rem;font-weight:500;color:var(--ink2);font-style:italic}
.ev-how{font-size:.85rem;color:var(--ink2);max-width:60ch}
.msgbox{padding:10px 14px;border-radius:10px;margin:0 0 12px;font-size:.9rem}
.msgbox.err{background:var(--bad-soft);border-left:4px solid var(--bad)}
.msgbox.warn{background:var(--hi-soft);border-left:4px solid var(--hi)}
table.data.calc-t td:last-child,table.data.calc-t th:last-child{text-align:left}
@media (max-width:900px){.calc-wrap{grid-template-columns:1fr}}
footer{max-width:1120px;margin:0 auto;padding:0 24px 40px;font-size:.82rem;color:var(--muted)}
footer .card{padding:14px 18px}
@media (max-width:900px){
  .hero,.charts,.insights{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .msg{max-width:92%}
}
@media (max-width:640px){
  header{position:static}
  .hdr{padding:10px 14px;gap:10px}
  nav{order:3;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  nav a{white-space:nowrap;padding:6px 11px;font-size:.88rem}
  .lang{margin-left:auto}
  main{padding:20px 14px 32px}
  .pad{padding:18px 16px}
  .tl-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .timeline{min-width:560px}
  .timeline .when{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</header>

<footer><div class="card" id="foot"></div></footer>

  b:{en:"A European patent application can be filed online with the EPO or, in many cases, with a national patent office. It can be filed in any language, but the proceedings are conducted in one of the EPO's three official languages: English, French or German. The Receiving Section first checks whether a filing date can be accorded, then carries out a formalities examination: are the required documents, designations and fees in order?",
     de:"Eine europäische Patentanmeldung kann online beim EPA oder in vielen Fällen bei einem nationalen Patentamt eingereicht werden. Sie kann in jeder Sprache eingereicht werden, das Verfahren wird aber in einer der drei Amtssprachen des EPA geführt: Deutsch, Englisch oder Französisch. Die Eingangsstelle prüft zunächst, ob ein Anmeldetag zuerkannt werden kann, und führt dann die Formalprüfung durch: Sind die erforderlichen Unterlagen, Benennungen und Gebühren in Ordnung?",

     fr:"Chaque demande fait l'objet d'une recherche obligatoire. Un examinateur identifie l'état de la technique pertinent et établit le rapport de recherche européenne, accompagné d'un avis au stade de la recherche : une première appréciation provisoire de la brevetabilité de l'invention. L'OEB vise à l'émettre dans un délai d'environ six mois à compter du dépôt, afin que le demandeur puisse décider tôt de poursuivre ou non."},

  t:{en:"Examination",de:"Prüfung",fr:"Examen"},
  b:{en:"To continue, the applicant files a request for examination and pays the examination fee within six months of the date on which the European Patent Bulletin mentions the publication of the search report. An examining division, normally three examiners, then assesses whether the application meets the requirements of the European Patent Convention. The applicant can reply to objections and amend the claims. When the division is ready to grant, it informs the applicant of the text in which it intends to grant the patent.",
     de:"Um fortzufahren, stellt der Anmelder innerhalb von sechs Monaten nach dem Tag, an dem im Europäischen Patentblatt auf die Veröffentlichung des Recherchenberichts hingewiesen wird, den Prüfungsantrag und zahlt die Prüfungsgebühr. Eine Prüfungsabteilung, in der Regel drei Prüfer, beurteilt dann, ob die Anmeldung die Erfordernisse des Europäischen Patentübereinkommens erfüllt. Der Anmelder kann auf Einwände erwidern und die Ansprüche ändern. Ist die Abteilung zur Erteilung bereit, teilt sie dem Anmelder die Fassung mit, in der sie das Patent erteilen will.",
     fr:"Pour poursuivre, le demandeur présente une requête en examen et acquitte la taxe d'examen dans un délai de six mois à compter de la date à laquelle le Bulletin européen des brevets mentionne la publication du rapport de recherche. Une division d'examen, normalement composée de trois examinateurs, vérifie ensuite si la demande satisfait aux exigences de la Convention sur le brevet européen. Le demandeur peut répondre aux objections et modifier les revendications. Lorsque la division est prête à délivrer le brevet, elle notifie au demandeur le texte dans lequel elle envisage de le délivrer."},
  k:{en:"Key takeaway: to close this stage, the applicant approves the text, pays the grant and publication fees and files translations of the claims into the other two official languages.",de:"Kernaussage: Zum Abschluss billigt der Anmelder die Fassung, zahlt die Erteilungs- und Veröffentlichungsgebühr und reicht Übersetzungen der Ansprüche in die beiden anderen Amtssprachen ein.",fr:"À retenir : pour clore cette étape, le demandeur approuve le texte, acquitte les taxes de délivrance et de publication et produit une traduction des revendications dans les deux autres langues officielles."}},
 {when:{en:"~2–5 years",de:"~2–5 Jahre",fr:"~2 à 5 ans"},
  t:{en:"Grant & validation",de:"Erteilung & Validierung",fr:"Délivrance et validation"},
  b:{en:"The decision to grant takes effect on the date its mention is published in the European Patent Bulletin. The European patent then becomes a bundle of national patents in the states where it is validated. Since 1 June 2023, the proprietor can also request unitary effect, a Unitary Patent covering the participating EU member states, no later than one month after the mention of the grant.",
     de:"Die Entscheidung über die Erteilung wird an dem Tag wirksam, an dem im Europäischen Patentblatt auf die Erteilung hingewiesen wird. Das europäische Patent wird dann zu einem Bündel nationaler Patente in den Staaten, in denen es validiert wird. Seit dem 1. Juni 2023 kann der Inhaber außerdem spätestens einen Monat nach dem Hinweis auf die Erteilung die einheitliche Wirkung beantragen: ein Einheitspatent für die teilnehmenden EU-Mitgliedstaaten.",
     fr:"La décision de délivrance prend effet à la date à laquelle sa mention est publiée au Bulletin européen des brevets. Le brevet européen devient alors un faisceau de brevets nationaux dans les États où il est validé. Depuis le 1er juin 2023, le titulaire peut aussi demander l'effet unitaire, un brevet unitaire couvrant les États membres participants de l'UE, au plus tard un mois après la mention de la délivrance."},
  k:{en:"Key takeaway: the whole grant procedure typically takes about two to five years from filing.",de:"Kernaussage: Das gesamte Erteilungsverfahren dauert ab Einreichung typischerweise etwa zwei bis fünf Jahre.",fr:"À retenir : la procédure de délivrance dure généralement de deux à cinq ans à compter du dépôt."}},
 {when:{en:"+9 months",de:"+9 Monate",fr:"+9 mois"},
  t:{en:"Opposition",de:"Einspruch",fr:"Opposition"},
  b:{en:"Within nine months of the publication of the mention of grant, any person except the proprietor can file a notice of opposition with the EPO and pay the opposition fee. This single, central procedure can challenge the patent for all states at once. The grounds are limited (Art. 100 EPC): the subject-matter is not patentable, the invention is not disclosed clearly and completely enough, or the patent extends beyond the content of the application as filed. An opposition division of three examiners decides to revoke the patent, maintain it, or maintain it in amended form.",
     de:"Innerhalb von neun Monaten nach der Veröffentlichung des Hinweises auf die Erteilung kann jede Person außer dem Patentinhaber beim EPA Einspruch einlegen und die Einspruchsgebühr zahlen. In diesem zentralen Verfahren kann das Patent für alle Staaten gleichzeitig angegriffen werden. Die Gründe sind begrenzt (Art. 100 EPÜ): Der Gegenstand ist nicht patentfähig, die Erfindung ist nicht deutlich und vollständig genug offenbart, oder das Patent geht über den Inhalt der ursprünglich eingereichten Anmeldung hinaus. Eine Einspruchsabteilung aus drei Prüfern widerruft das Patent, hält es aufrecht oder hält es in geänderter Fassung aufrecht.",
     fr:"Dans un délai de neuf mois à compter de la publication de la mention de la délivrance, toute personne, à l'exception du titulaire, peut former opposition auprès de l'OEB et acquitter la taxe d'opposition. Cette procédure centralisée permet de contester le brevet pour tous les États à la fois. Les motifs sont limités (art. 100 CBE) : l'objet n'est pas brevetable, l'invention n'est pas exposée de façon suffisamment claire et complète, ou le brevet s'étend au-delà du contenu de la demande telle que déposée. Une division d'opposition de trois examinateurs révoque le brevet, le maintient ou le maintient sous une forme modifiée."},
  k:{en:"Key takeaway: the nine-month opposition period cannot be extended.",de:"Kernaussage: Die neunmonatige Einspruchsfrist ist nicht verlängerbar.",fr:"À retenir : le délai d'opposition de neuf mois ne peut pas être prolongé."}}

const C=()=>CALC[S.lang];
const LOC=()=>({en:"en-GB",de:"de-DE",fr:"fr-FR"}[S.lang]);
/* parse "YYYY-MM-DD" as a UTC calendar date; null if empty or invalid */
function pd(s){ if(!/^\d{4}-\d{2}-\d{2}$/.test(s||"")) return null;
  const [y,m,d]=s.split("-").map(Number), dt=new Date(Date.UTC(y,m-1,d));
  return dt.getUTCMonth()===m-1&&dt.getUTCDate()===d?dt:null; }
/* Rule 131(4) EPC: same day number in the later month, or that month's last day */
function addM(dt,n){ const y=dt.getUTCFullYear(),m=dt.getUTCMonth()+n,d=dt.getUTCDate();
  const last=new Date(Date.UTC(y,m+1,0)).getUTCDate(); return new Date(Date.UTC(y,m,Math.min(d,last))); }
const fmtD=dt=>dt.toLocaleDateString(LOC(),{weekday:"short",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
const isoD=dt=>dt.toISOString().slice(0,10);
let calcTable=false;

function calcView(){
  const c=C(), v=S.calc||{};
  const field=(k,lbl,hint,tag,tagCls)=>`<div class="field"><label for="cd-${k}">${lbl} <span class="badge ${tagCls}">${tag}</span></label>
    <span class="hint" id="cd-${k}-h">${hint}</span>
    <input type="date" id="cd-${k}" data-calc="${k}" value="${esc(v[k]||"")}" aria-describedby="cd-${k}-h cd-${k}-e" ${k==="f"?'aria-required="true"':''} min="1900-01-01" max="2199-12-31">
    <span class="hint" id="cd-${k}-e" role="status"></span></div>`;
  return `<div class="lesson"><div class="eyebrow">${c.ey}</div><h2>${c.h}</h2>
    <p style="max-width:72ch">${c.p}</p>
    <div class="disc" role="note">⚠ ${c.disc}</div>
    <div class="calc-wrap">
      <form id="calcf" novalidate aria-labelledby="calcf-h" onsubmit="return false">
        <h3 id="calcf-h">${c.formH}</h3>
        ${field("f",c.fF,c.fFh,c.req,"ok")}
        ${field("p",c.fP,c.fPh,c.opt,"in")}
        ${field("s",c.fS,c.fSh,c.evIn,"dep")}
        ${field("g",c.fG,c.fGh,c.evIn,"dep")}
        <div class="calc-btns"><button type="button" class="btn quiet" data-calcex="1">${c.example}</button>
          <button type="button" class="btn quiet" data-calcclear="1">${c.clear}</button></div>
      </form>
      <section aria-labelledby="calcr-h">
        <div class="chart-head"><h3 id="calcr-h">${c.resH}</h3><button type="button" class="linkbtn" data-calcview="1" aria-controls="calcOut">${calcTable?T().showChart:T().showTable}</button></div>
        <div id="calcEx"></div>
        <div id="calcOut"></div>
        <div class="sr-only" id="calcStatus" aria-live="polite"></div>
      </section>
    </div>
    <p class="notice">${c.rules}</p></div>`;
}

function calcModel(){
  const c=C(), v=S.calc||{}, msgs=[], bad={};
  ["f","p","s","g"].forEach(k=>{ if(v[k]&&!pd(v[k])) bad[k]=true; });
  const f=pd(v.f); let p=pd(v.p), s=pd(v.s), g=pd(v.g);
  if(!f) return {start:true,bad,msgs,items:[]};
  if(p&&p>f){ msgs.push(["err",c.ePri]); bad.p=true; p=null; }
  else if(p&&addM(p,12)<f) msgs.push(["warn",c.wPriOld]);
  if(s&&s<f){ msgs.push(["err",c.eSrch]); bad.s=true; s=null; }
  if(g&&(g<f||(s&&g<s))){ msgs.push(["err",c.eGrant]); bad.g=true; g=null; }
  const base=p||f, items=[];
  const ent=(name,dt)=>({k:"in",name,date:dt,how:c.hIn});
  const ev=(name,dt)=>dt?ent(name,dt):{k:"wait",name,date:null,how:c.wEv};
  const dep=(name,from,n,how,wait,lbl,src)=>from?{k:"dep",name,date:addM(from,n),how:how(fmtD(from)),lbl,src}:{k:"dep",none:true,name,date:null,how:wait,lbl,src};
  if(p) items.push(ent(c.nPri,p));
  items.push(ent(c.nFil,f));
  items.push({k:"calc",name:c.nPub,date:addM(base,18),how:c.hPub(p?c.basePri:c.baseFil,fmtD(base)),lbl:c.lPub,src:"a93"});
  items.push(ev(c.nSrch,s));
  items.push(dep(c.nExam,s,6,c.hExam,c.wSrch,c.lExam,"r70"));
  items.push(ev(c.nGrant,g));
  items.push(dep(c.nUp,g,1,c.hUp,c.wGrant,c.lUp,"upr6"));
  items.push(dep(c.nOpp,g,9,c.hOpp,c.wGrant,c.lOpp,"a99"));
  return {start:false,bad,msgs,items};
}

function drawCalc(){
  const out=document.getElementById("calcOut"); if(!out) return;
  const c=C(), m=calcModel(), t=T();
  ["f","p","s","g"].forEach(k=>{const i=document.getElementById("cd-"+k),e=document.getElementById("cd-"+k+"-e");
    const invalid=!!m.bad[k]; i.setAttribute("aria-invalid",invalid);
    e.textContent=invalid&&(S.calc[k]&&!pd(S.calc[k]))?c.bad:"";});
  document.getElementById("calcEx").innerHTML=S.calc.ex?`<p style="margin:0 0 10px"><span class="sample">⚠ ${c.exLbl}</span></p>`:"";
  const tag=it=>it.k==="calc"?["ok",c.bCalc,"="]:it.k==="in"?["in",c.bIn,"✎"]:it.k==="wait"?["wait",c.bWait,"?"]:it.none?["wait",c.bDep,"…"]:["dep",c.bDep,"⧗"];
  const msgs=m.msgs.map(x=>`<div class="msgbox ${x[0]}">${x[1]}</div>`).join("");
  if(m.start){ out.innerHTML=`<p class="muted">${c.start}</p>`; document.getElementById("calcStatus").textContent=""; return; }
  const dateTxt=it=>it.date?`<time datetime="${isoD(it.date)}">${fmtD(it.date)}</time>`:(it.k==="wait"?c.noEv:c.noDate);
  const srcA=it=>it.src?` <a href="${SRC[it.src].u}" target="_blank" rel="noopener">${it.lbl}</a>`:"";
  const legend=`<ul class="legend">
    <li><span class="badge ok">= ${c.bCalc}</span>${c.lgCalc}</li>
    <li><span class="badge dep">⧗ ${c.bDep}</span>${c.lgDep}</li>
    <li><span class="badge in">✎ ${c.bIn}</span>${c.lgIn}</li>
    <li><span class="badge wait">? ${c.bWait}</span>${c.lgWait}</li></ul>`;
  let body;
  if(calcTable){
    body=`<table class="data calc-t"><caption class="sr-only">${c.resH}</caption><thead><tr><th scope="col">${c.colStep}</th><th scope="col">${c.colDate}</th><th scope="col">${c.colType}</th><th scope="col">${c.colBasis}</th></tr></thead><tbody>${
      m.items.map(it=>`<tr><th scope="row" style="font-weight:600">${it.name}</th><td>${dateTxt(it)}</td><td>${tag(it)[1]}</td><td>${it.src?srcA(it):"–"}</td></tr>`).join("")}</tbody></table>`;
  } else {
    body=legend+`<ol class="ctl">${m.items.map(it=>{const [cls,b,ic]=tag(it);
      const dotCls=it.k==="calc"?"calc":it.k==="in"?"in":it.k==="wait"?"wait":it.none?"none":"dep";
      return `<li class="${it.k}${it.none?' none':''}"><span class="dot ${dotCls}" aria-hidden="true">${ic}</span>
        <div class="ev-top"><span class="ev-name">${it.name}</span><span class="badge ${cls}">${b}</span></div>
        <div class="ev-date ${it.date?'':'none'}">${dateTxt(it)}</div>
        <div class="ev-how">${it.how}${it.src?` · ${c.basis}${srcA(it)}`:""}</div></li>`;}).join("")}</ol>`;
  }
  out.innerHTML=msgs+body;
  const calcd=m.items.filter(i=>(i.k==="calc"||i.k==="dep")&&i.date).length, waiting=m.items.filter(i=>i.k==="dep"&&!i.date).length;
  document.getElementById("calcStatus").textContent=c.status(calcd,waiting);
}

function bindQuiz(){
  picks={}; const qz=document.getElementById("quiz"),t=T();
  qz.addEventListener("click",e=>{const b=e.target.closest(".opt"); if(!b||qz.dataset.locked) return;
    qz.querySelectorAll(`.opt[data-q="${b.dataset.q}"]`).forEach(x=>x.setAttribute("aria-pressed","false"));

  document.getElementById("submitQuiz").addEventListener("click",()=>{
    const res=document.getElementById("qres");
    if(Object.keys(picks).length<QUIZ.length){res.innerHTML=`<div class="result fail">${t.answerAll(QUIZ.length)}</div>`;return;}
    qz.dataset.locked=1; let r=0;
    QUIZ.forEach((q,qi)=>{const ok=picks[qi]===q.a; if(ok) r++;
      qz.querySelector(`.opt[data-q="${qi}"][data-o="${q.a}"]`).classList.add("right");
      if(!ok) qz.querySelector(`.opt[data-q="${qi}"][data-o="${picks[qi]}"]`).classList.add("wrong");

    const sc=r/QUIZ.length,pass=sc>=.7; S.best=Math.max(S.best||0,sc); save();
    const all=doneCount()===LESSONS.length;
    res.innerHTML=`<div class="result ${pass?'pass':'fail'}"><b>${t.score(r,QUIZ.length,Math.round(sc*100))}</b> ${pass?t.passed:t.failed}
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      ${pass&&all?`<button class="btn" data-open="cert">${t.getCert}</button>`:""}
      ${pass&&!all?`<span class="small muted">${t.finishLessons}</span>`:""}
      <button class="btn ghost" data-open="quiz">${t.retake}</button></div></div>`;
    document.getElementById("submitQuiz").disabled=true;
  });
}
function certView(){
  const t=T(),loc={en:"en-GB",de:"de-DE",fr:"fr-FR"}[S.lang];
  const d=new Date().toLocaleDateString(loc,{day:"numeric",month:"long",year:"numeric"});
  return `<div class="lesson"><h2>${t.certTab}</h2><label class="muted small" for="cn">${t.certHint}</label><br>
    <input type="text" id="cn" placeholder="${t.yourName}" value="${esc(S.name)}" style="margin-top:6px">
    <div class="cert"><div class="eyebrow">${t.certEy}</div><h2>${L({en:"The European patent grant procedure",de:"Das europäische Patenterteilungsverfahren",fr:"La procédure de délivrance du brevet européen"})}</h2>
    <div>${t.certFor}</div><div class="name" id="cno">${esc(S.name||t.yourName)}</div>
    <div>${t.certDid(Math.round((S.best||0)*100))}</div><p class="muted small" style="margin-top:16px">Patent Learning Lab · ${d}</p></div></div>`;
}

/* ---------- tutor ---------- */
function answer(q){
  const s=q.toLowerCase(); let best=null,score=0;
  KB.forEach(k=>{const n=k.kw.filter(w=>s.includes(w)).length; if(n>score){score=n;best=k;}});
  return best?{text:L(best.a),src:SRC[best.src]}:{text:T().fallback,src:null};
}
function tutor(){
  const t=T();
  if(!chat.length) chat=[{bot:true,hello:true}];
  app.innerHTML=`<section class="card pad"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="eyebrow">${t.tutorEy}</div>${pathPill()}</div><h2>${t.tutorT}</h2>
    <p class="muted" style="max-width:70ch">${t.tutorP}</p>
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="chips">${t.chips.map(c=>`<button class="chip" data-ask="${esc(c)}">${c}</button>`).join("")}</div>
    <form class="ask" id="askf"><input type="text" id="askq" placeholder="${esc(t.askPh)}" aria-label="${esc(t.askPh)}"><button class="btn" type="submit">${t.send}</button></form>
    <div class="notice">${t.tutorNote}</div></section>`;
  drawChat();
  document.getElementById("askf").addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("askq");if(i.value.trim()){ask(i.value.trim());i.value="";}});
}
function ask(q){ chat.push({me:q}); chat.push({bot:true,...answer(q)}); drawChat(); }
function drawChat(){
  const c=document.getElementById("chat"); if(!c) return; const t=T();
  c.innerHTML=chat.map(m=>m.me?`<div class="msg me">${esc(m.me)}</div>`:
    `<div class="msg bot">${m.hello?t.hello:esc(m.text)}${m.src?`<span class="cite">📎 ${t.srcLbl}: <a href="${m.src.u}" target="_blank" rel="noopener">${m.src.t}</a></span>`:""}</div>`).join("");
  c.scrollTop=c.scrollHeight;
}

/* ---------- insights ---------- */
function bars(id,rows,hiIdx,unit){
  return `<div class="bars" id="${id}" role="img" aria-label="${esc(rows.map(r=>r[0]+": "+r[1]+unit).join(", "))}">${rows.map((r,i)=>
    `<div class="bar-row" data-tip="${esc(r[2]||r[0])}: ${r[1]}${unit}"><span class="bl">${esc(r[0])}</span>
      <div class="track"><div class="fill ${i===hiIdx?'hi':''}" style="width:${r[1]}%"></div></div><span class="bv">${r[1]}${unit}</span></div>`).join("")}</div>`;
}
function table(rows,unit){const t=T();return `<table class="data"><thead><tr><th>${t.colItem}</th><th>${t.colVal}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[2]||r[0])}</td><td>${r[1]}${unit}</td></tr>`).join("")}</tbody></table>`;}
function chartCard(key,title,sub,rows,hi){
  const t=T();
  return `<div class="card chart-card"><div class="chart-head"><div><h3>${title}</h3><div class="small muted">${sub}</div></div>
    <button class="linkbtn" data-toggle="${key}">${t.showTable}</button></div>
    <div data-chart="${key}">${bars("b-"+key,rows,hi,"%")}</div><div data-table="${key}" hidden>${table(rows,"%")}</div></div>`;
}
function insights(){
  const t=T();
  const funnel=DATA.funnel.map((r,i)=>[r[0],r[1],L(LESSONS[i].t)]);
  const qs=DATA.questions.map((r,i)=>[r[0],r[1],r[0]+" · "+L(QUIZ[i].q)]);
  const reg=DATA.regionVals.map((v,i)=>[L(DATA.regions)[i],v]);
  const best=S.best===null?"–":Math.round(S.best*100)+"%";
  app.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><div class="eyebrow">${t.insEy}</div>${pathPill()}</div>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap"><h1 style="margin:0">${t.insT}</h1><span class="sample">⚠ ${t.sampleLbl}</span></div>
    <div class="kpis">
      <div class="card kpi"><b>${(2480).toLocaleString(S.lang)}</b><span>${t.kLearners}</span></div>
      <div class="card kpi"><b>55${S.lang==="en"?"":" "}%</b><span>${t.kComp}</span></div>
      <div class="card kpi"><b>${(4.4).toLocaleString(S.lang)}</b><span>${t.kRating}</span></div>
      <div class="card kpi"><b>14 min</b><span>${t.kTime}</span></div></div>
    <div class="charts">${chartCard("f",t.c1,t.c1s,funnel,3)}${chartCard("q",t.c2,t.c2s,qs,1)}${chartCard("r",t.c3,t.c3s,reg,-1)}</div>
    <h3 style="margin-top:26px">${t.insH}</h3>
    <div class="insights">${t.ins.map(x=>`<div class="card ins"><div class="k">${x[0]}</div><div class="a">${x[1]}</div></div>`).join("")}</div>
    <div class="card pad" style="margin-top:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
      <div><div class="eyebrow">● ${t.yourSess}</div><div>${t.yourSessP(doneCount(),best)}</div></div>
      <button class="btn quiet" id="reset">${t.reset}</button></div>`;
  const r=document.getElementById("reset");let armed=false;
  r.addEventListener("click",()=>{if(!armed){armed=true;r.textContent=t.resetConfirm;return;} S.done={};S.best=null;save();render();});
}

/* ---------- about ---------- */
function about(){
  const t=T();
  app.innerHTML=`<section class="card pad"><div class="eyebrow">${t.aboutEy}</div><h1>${t.aboutT}</h1><p class="muted" style="max-width:72ch">${t.aboutP}</p>
    <table class="map"><thead><tr><th>${t.mapH[0]}</th><th>${t.mapH[1]}</th></tr></thead><tbody>${t.map.map(m=>`<tr><td><b>${m[0]}</b></td><td>${m[1]}</td></tr>`).join("")}</tbody></table></section>
    <section class="card pad" style="margin-top:16px"><h2>${t.pipeH}</h2>
    <div class="pipe">${t.pipe.map(p=>`<div class="${p[2]?'human':''}"><b>${p[0]}</b>${p[1]}</div>`).join("")}</div>
    <p class="small muted" style="max-width:72ch">${t.pipeNote}</p></section>
    <section class="card pad" style="margin-top:16px"><h3>${t.srcH}</h3><ul>${Object.values(SRC).map(s=>`<li><a href="${s.u}" target="_blank" rel="noopener">${s.t}</a></li>`).join("")}</ul></section>`;
}

/* ---------- events ---------- */
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{const r=e.target.closest&&e.target.closest("[data-tip]");
  if(r){tip.textContent=r.dataset.tip;tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,innerWidth-250)+"px";tip.style.top=(e.clientY+14)+"px";} else tip.style.opacity=0;});
document.addEventListener("click",e=>{
  const lg=e.target.closest("[data-lang]"); if(lg){S.lang=lg.dataset.lang;save();render();return;}
  const pa=e.target.closest("[data-path]"); if(pa){S.path=pa.dataset.path;save();}
  const it=e.target.closest("[data-interest]"); if(it){const id=it.dataset.interest;S.interest[id]=!S.interest[id];save();
    it.setAttribute("aria-pressed",S.interest[id]);it.textContent=S.interest[id]?P().noted:P().notify;return;}
  const sc=e.target.closest("[data-scroll]"); if(sc){e.preventDefault();document.getElementById(sc.dataset.scroll).scrollIntoView({behavior:"smooth"});return;}
  const th=e.target.closest("[data-tohome]"); if(th&&view.page==="home"){e.preventDefault();document.getElementById("pathways").scrollIntoView({behavior:"smooth"});return;}
  if(th){e.preventDefault();location.hash="home";setTimeout(()=>{const el=document.getElementById("pathways");if(el)el.scrollIntoView();},60);return;}
  const gq=e.target.closest("[data-goquiz]"); if(gq){view.lesson="quiz";}
  const cp=e.target.closest("[data-complete]"); if(cp){const i=+cp.dataset.complete;S.done[i]=true;save();view.lesson=i<LESSONS.length-1?i+1:"quiz";render();scrollTo(0,0);return;}
  const cx=e.target.closest("[data-calcex]"); if(cx){S.calc={...CALC_EXAMPLE,ex:true};save();["f","p","s","g"].forEach(k=>{document.getElementById("cd-"+k).value=S.calc[k];});drawCalc();return;}
  const cc=e.target.closest("[data-calcclear]"); if(cc){S.calc={};save();["f","p","s","g"].forEach(k=>{document.getElementById("cd-"+k).value="";});drawCalc();document.getElementById("cd-f").focus();return;}
  const cv=e.target.closest("[data-calcview]"); if(cv){calcTable=!calcTable;cv.textContent=calcTable?T().showChart:T().showTable;drawCalc();return;}
  const op=e.target.closest("[data-open]"); if(op){const v=op.dataset.open;if(v==="")return;view.lesson=(v==="quiz"||v==="cert"||v==="calc")?v:+v;
    if(view.page!=="course"){location.hash="course";} else {render();} scrollTo(0,0);return;}
  const ak=e.target.closest("[data-ask]"); if(ak){ask(ak.dataset.ask);return;}
  const tg=e.target.closest("[data-toggle]"); if(tg){const k=tg.dataset.toggle,c=document.querySelector(`[data-chart="${k}"]`),tb=document.querySelector(`[data-table="${k}"]`);
    const show=tb.hidden; tb.hidden=!show; c.hidden=show; tg.textContent=show?T().showChart:T().showTable;}
});
document.addEventListener("input",e=>{const ck=e.target.dataset&&e.target.dataset.calc;
  if(ck){S.calc=S.calc||{};S.calc[ck]=e.target.value;delete S.calc.ex;save();drawCalc();return;}
  if(e.target.id==="cn"){S.name=e.target.value;save();document.getElementById("cno").textContent=S.name||T().yourName;}});
function route(){const h=location.hash.slice(1);const pages=["home","course","tutor","insights","about"];
  const p=pages.includes(h)?h:"home"; if(p!=="course"&&view.page==="course"&&p!==view.page){} view.page=p; render(); }
addEventListener("hashchange",()=>{route();scrollTo(0,0);});
route();
</script>
</body>
