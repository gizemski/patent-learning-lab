<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patent Learning Lab: Concept Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#app" id="skip">Skip to content</a>
<header>
  <div class="hdr">
    <a class="brand" href="#home"><span class="mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
    </span>Patent Learning Lab</a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" lang="en">EN</button><button data-lang="de" lang="de">DE</button><button data-lang="fr" lang="fr">FR</button>
    </div>
    <div class="rolebar">
      <div class="roles" role="group" aria-labelledby="viewas">
        <span id="viewas" class="roles-lbl">View as</span>
        <button data-role="learner">Learner</button><button data-role="instructor">Instructor</button><button data-role="admin">Admin</button>
      </div>
      <span class="demo-badge" id="demo">Demo mode – no real login</span>
    </div>
  </div>
  <div class="role-banner" id="banner" hidden></div>
</header>
<div class="sr-only" id="announce" aria-live="polite"></div>
<main id="app" tabindex="-1"></main>
<footer><div class="card" id="foot"></div></footer>
<div class="tip" id="tip" role="tooltip"></div>

<!-- Classic scripts (no modules, no fetch) so the site also works when opened directly from disk. Order matters. -->
<script src="js/i18n.js" defer></script>
<script src="js/pathways.js" defer></script>
<script src="js/content/epo.js" defer></script>
<script src="js/demo-data.js" defer></script>
<script src="js/state.js" defer></script>
<script src="js/views/learner.js" defer></script>
<script src="js/views/instructor.js" defer></script>
<script src="js/views/admin.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
